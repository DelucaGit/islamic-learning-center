spring:
  application:
    name: islamic-learning-center
  # Set via env: SPRING_PROFILES_ACTIVE (e.g. local, prod). Default local for developer machines.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    # Set via env: SPRING_DATASOURCE_URL — full JDBC URL (host, port, database). No default; set in OS or IDE env only.
    url: ${SPRING_DATASOURCE_URL}
    # Set via env: SPRING_DATASOURCE_USERNAME — PostgreSQL login role. No default; set in OS or IDE env only.
    username: ${SPRING_DATASOURCE_USERNAME}
    # Set via env: SPRING_DATASOURCE_PASSWORD — no default; set in OS, IDE env, or AWS Secrets Manager in prod. Never commit.
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

---
# Production-oriented defaults: override via env (RDS URL, secrets). Do not put real values here.
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    # Set via env: SPRING_DATASOURCE_URL — RDS PostgreSQL JDBC URL (sslmode as required by your RDS policy).
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
